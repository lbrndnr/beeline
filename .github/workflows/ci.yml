name: CI

on:
    push:
        branches:
            - "**"
            - "!dependabot/**"
    pull_request:
        branches: [main]
    workflow_call:

jobs:
    test:
        name: Test [${{ matrix.rust }}, ${{ matrix.profile }}]
        runs-on: ubuntu-26.04
        strategy:
            fail-fast: false
            matrix:
                rust: [stable, nightly]
                profile: [dev]
                include:
                    - rust: stable
                      profile: release
        # Anything nightly is treated as informational-only.
        continue-on-error: ${{ matrix.rust == 'nightly' }}
        steps:
            - name: "Set environmental variables"
              shell: bash
              run: |
                  #RUST_BACKTRACE_nightly='1'
                  #CFLAGS_nightly='-fsanitize=leak'
                  #CXXFLAGS_nightly='-fsanitize=leak'
                  #RUSTFLAGS_nightly='-Zsanitizer=leak'

                  # A function for defining a variable conditional on the toolchain in
                  # use.
                  tc_var() {
                    # Replace any dots in the toolchain name with underscores. Necessary
                    # due to shell imposed variable naming restrictions.
                    var="${1}_$(echo ${{ matrix.rust }} | tr . _)"
                    echo "${1}=${!var}" >> ${GITHUB_ENV}
                  }

                  tc_var RUST_BACKTRACE
                  tc_var RUSTFLAGS
                  tc_var CFLAGS
                  tc_var CXXFLAGS
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ matrix.rust }}
                  components: rustfmt
            - name: "Get kernel release"
              id: kernel
              run: echo "release=$(uname -r)" >> "${GITHUB_OUTPUT}"
            - name: Install apt dependencies
              uses: awalsh128/cache-apt-pkgs-action@v1
              with:
                  packages: clang-18 llvm-18 libelf-dev zlib1g-dev linux-headers-${{ steps.kernel.outputs.release }}
                  version: 1.0
            - name: Configure apt dependencies
              run: |
                  sudo ln -sf /usr/include/asm-generic /usr/include/asm
                  sudo rm -f /bin/clang && sudo ln -s /usr/bin/clang-18 /bin/clang && sudo ln -s /usr/bin/llvm-strip-18 /bin/llvm-strip
            - name: Cache bpftool
              id: cache-bpftool
              uses: actions/cache@v6
              with:
                  path: /usr/local/sbin/bpftool
                  key: bpftool-v7.7.0-${{ runner.os }}-${{ runner.arch }}
            - name: Install bpftool
              if: steps.cache-bpftool.outputs.cache-hit != 'true'
              env:
                  BPFTOOL_VERSION: v7.7.0
              run: |
                  arch=$([ "${{ runner.arch }}" = "ARM64" ] && echo arm64 || echo amd64)
                  curl -sSL "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-${arch}.tar.gz" | sudo tar -xz -C /usr/local/sbin bpftool
                  sudo chmod +x /usr/local/sbin/bpftool
            - name: Dump BTF
              run: |
                  mkdir -p include
                  /usr/local/sbin/bpftool btf dump file /sys/kernel/btf/vmlinux format c > include/vmlinux.h
            - uses: Swatinem/rust-cache@v2
            - name: Build
              run: cargo build --profile=${{ matrix.profile }} --locked --verbose --workspace
            - name: Run tests
              # Skip tests which require sudo
              run: cargo test --profile=${{ matrix.profile }} --locked --verbose --workspace -- --skip ':root:' --include-ignored
            - name: Run root tests
              run: cd beeline && cargo test --profile=${{ matrix.profile }} --locked --verbose -- ':root:'
