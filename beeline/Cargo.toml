[package]
name = "beeline"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
as-bytes = "0.2.0"
bytes = "1.11.1"
httlib-huffman = "0.3.4"
libbpf-rs = "0.26.0"
libc = "0.2.182"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[build-dependencies]
libbpf-cargo = "0.26.0"

[dev-dependencies]
reqwest = "0.13.2"
tokio = { version = "1.49", features = ["full"] }
utils = { path = "../utils" }
