[package]
name = "example"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["http2"] }
# the connection loop drives h2 itself so that it can reach the dynamic table,
# see the [patch.crates-io] section of the workspace manifest
h2 = "0.4.16"
http = "1.5"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
beeline = { path = "../beeline", features = ["h1", "h2"] }
tokio = { version = "1.53", features = ["full"] }
httlib-huffman = "0.3.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "set-status"] }
libc = "0.2.189"
anyhow = "1.0.104"
as-bytes = "0.2.0"
xbpf = { git = "https://github.com/lbrndnr/ebpf.git", branch = "map" }

[build-dependencies]
xbpf = { git = "https://github.com/lbrndnr/ebpf.git", branch = "map", features = ["build"] }
beeline = { path = "../beeline", features = ["build"] }

[dev-dependencies]
anyhow = "1.0.104"
